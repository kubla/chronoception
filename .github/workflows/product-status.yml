name: Product status
on:
  workflow_run:
    workflows: [Native acceptance]
    types: [completed]
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: product-status
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Publish known product coverage from the trusted default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 verification/product_status.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: product-status
          path: product-status.json
          retention-days: 30
